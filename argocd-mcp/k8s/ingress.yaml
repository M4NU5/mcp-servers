apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-mcp
  namespace: tools
spec:
  rules:
    - host: argocd-mcp.bongofett.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-mcp
                port:
                  number: 3000
