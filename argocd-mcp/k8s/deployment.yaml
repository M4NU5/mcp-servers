apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: tools
  labels:
    app: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
        - name: argocd-mcp
          image: ghcr.io/argoproj-labs/mcp-for-argocd:v0.9.0
          args: ["http", "--allowed-host-header", "argocd-mcp.bongofett.com"]
          ports:
            - containerPort: 3000
          env:
            - name: ARGOCD_BASE_URL
              value: "http://argocd-server.argocd.svc.cluster.local"
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-mcp
                  key: ARGOCD_API_TOKEN
            # Inbound auth: callers must send "Authorization: Bearer <token>".
            - name: MCP_BIND_ADDRESS
              value: "0.0.0.0"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-mcp
                  key: MCP_AUTH_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
